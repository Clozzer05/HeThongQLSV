<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | Hệ Thống QLSV</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
  </head>
  <body>
    <main class="auth-wrap">
      <section class="auth-card">
        <div style="text-align: center; margin-bottom: 18px">
          <div
            style="
              font-size: 2.5rem;
              color: var(--primary-color);
              margin-bottom: 8px;
            "
          >
            <i class="fas fa-user-graduate"></i>
          </div>
          <h1
            style="
              margin: 0;
              font-size: 1.6rem;
              color: var(--primary-color);
              font-weight: 700;
            "
          >
            HỆ THỐNG QLSV
          </h1>
        </div>
        <form id="loginForm" autocomplete="off">
          <div style="margin-bottom: 14px">
            <label for="ten_dang_nhap" class="small">Tên đăng nhập</label>
            <input
              id="ten_dang_nhap"
              placeholder="Nhập tên đăng nhập"
              required
              autofocus
            />
          </div>
          <div style="margin-bottom: 18px">
            <label for="mat_khau" class="small">Mật khẩu</label>
            <input
              id="mat_khau"
              type="password"
              placeholder="Nhập mật khẩu"
              required
            />
          </div>
          <button
            class="btn btn-primary"
            type="submit"
            style="width: 100%; font-size: 1.1rem"
          >
            Đăng nhập <i class="fas fa-sign-in-alt"></i>
          </button>
        </form>
        <div
          id="loginAlert"
          class="alert hidden"
          style="margin-top: 14px"
        ></div>
      </section>
    </main>
    <script src="../js/common.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
